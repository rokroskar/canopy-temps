[project]
name = "canopy-temps"
version = "0.1.0"
description = "Notebook and Panel app for the EnviDat canopy air temperature dataset (doi:10.16904/envidat.722)"
readme = "README.md"
authors = [
    { name = "Rok Roškar", email = "rokroskar@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bokeh>=3.10.1",
    "holoviews>=1.23.2",
    "hvplot>=0.12.2",
    "ipykernel>=7.4.0",
    "mat-io>=1.0.2",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "panel>=1.10.0",
    "seaborn>=0.13.2",
]


[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
